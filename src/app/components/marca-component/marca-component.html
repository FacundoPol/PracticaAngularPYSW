<div class="row m-3">
            <div class="col-6 col-md-4 col-lg-2 mb-3" *ngFor="let marca of listaMarcas">
                <div class="card p-2 text-center card-hover" data-bs-toggle="modal" data-bs-target="#modelos"(click)="obtenerModelos(marca.id)" name="marcaId">{{marca.name}}</div>
            </div>
    </div>

<div class="modal fade" id="modelos" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Modelos Autos</h5>

        <button 
          type="button" 
          class="btn-close" 
          data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">
        <div class="row">
            <div class="col-6 col-md-4 col-lg-2 mb-3" *ngFor="let modelo of listaModelos">
                <div class="card p-2 text-center">{{modelo.name}}</div>
            </div>
        </div>
      </div>

      <div class="modal-footer">
        <button 
          type="button" 
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>
