<div class="container">

    <div class="mb-3">
          <label class="form-label">Receta</label>
          <input type="text" class="form-control" [(ngModel)]="comida">
          <button class="btn btn-success m-3" (click)="buscarReceta()">Buscar</button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Ingredientes</th>
          <th>Imagen</th>
          <th>Detalle</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let receta of recetas">
          <td>{{receta.name}}</td>
          <td>{{receta.description}}</td>
          <td><p *ngFor="let ingrediente of receta.ingredients">{{ingrediente.name}}</p></td>
          <td><img [src]="receta.image" alt=""></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>
