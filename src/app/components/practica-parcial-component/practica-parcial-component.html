<div class="container">
    <select class="form-select m-2" [(ngModel)]="anio" form="anio" name="anio">
        <option selected>2020</option>
        <option>2019</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
    </select>

    <button class="btn btn-success" (click)="obtenerCarrera()">Solicitar</button>


    <div class="container" >
        <div class="container mt-4">

  <div class="table-responsive" *ngIf="mostrarTabla">
    <table class="table table-striped table-bordered align-middle">
      
      <thead class="table-dark">
        <tr>
          <th>Race Id</th>
          <th>Carrera</th>
          <th>Sesiones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let carrera of carreras">
          <td>{{carrera.race_id}}</td>
          <td>{{carrera.name}}</td>
          <td *ngFor="let sesion of carrera.sessions" >{{sesion.id}}<button class="btn btn-success" (click)="obtenerSesion(sesion.id)"  data-bs-toggle="modal" data-bs-target="#miModal" >Ver Posiciones</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <button class="btn btn-primary" (click)="obtenerConstructores()">Ver Constructores</button>
    <h5>Campeonato de Constructores</h5>
    <p from="posi1">POSICION 1: {{constructores[0].team_name}}</p>
    <p from="posi2">POSICION 10: {{constructores[constructores.length-1].team_name}}</p>
<div class="modal fade" id="miModal" tabindex="-1">

  <div class="modal-dialog modal-lg">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Sesiones</h5>

        <button 
          type="button" 
          class="btn-close"
          data-bs-dismiss="modal">
        </button>
      </div>

      <div class="modal-body">

        <p *ngFor="let s of sesiones">Pilotos: <span class="badge bg-primary">{{s.name}}</span> - POSICION: <span class="badge bg-success">{{s.position}} </span> </p>

      </div>

      <div class="modal-footer">

        <button 
          type="button" 
          class="btn btn-secondary"
          data-bs-dismiss="modal">

          Cerrar
        </button>

      </div>

    </div>

  </div>

</div>
</div>
    </div>
</div>
