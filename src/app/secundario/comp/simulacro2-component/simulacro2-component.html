
<div class="container">

    <div class="mb-3">
          <label class="form-label">Videos sobre:</label>
          <input type="text" class="form-control" [(ngModel)]="nombre">
          <button class="btn btn-success m-3" (click)="obtenerVideo()">Buscar</button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      
      <thead class="table-dark">
        <tr>
          <th>Id Video</th>
          <th>Titutlo</th>
          <th>Enlace Video</th>
          <th>Canal Youtube</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let resultado of resultados">
          <td>{{resultado.video.videoId}}</td>
          <td>{{resultado.video.title}}</td>
          <td><a [href]="'https://www.youtube.com/watch?v='+resultado.video.videoId">Ver Video</a></td>
          <td><img [src]="resultado.video.author.avatar[0].url" alt="">{{resultado.video.author.title}}</td>
        </tr>
      </tbody>
    </table>
  </div>
